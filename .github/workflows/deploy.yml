name: Build and deploy CAS Sign

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cas-sign-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ESIGN_CLIENT_ID: ${{ secrets.ESIGN_CLIENT_ID }}
      ESIGN_SECRET_KEY: ${{ secrets.ESIGN_SECRET_KEY }}
      ESIGN_WEBHOOK_SECRET: ${{ secrets.ESIGN_WEBHOOK_SECRET }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build application
        run: npm run build
        env:
          # Do not embed API credentials into the generated Wrangler config.
          ESIGN_CLIENT_ID: ""
          ESIGN_SECRET_KEY: ""
          ESIGN_WEBHOOK_SECRET: ""

      - name: Deploy Worker
        run: npx wrangler deploy --config dist/server/wrangler.json --name cas-sign

      - name: Update encrypted eSign secrets
        run: |
          jq -n '{ESIGN_CLIENT_ID: env.ESIGN_CLIENT_ID, ESIGN_SECRET_KEY: env.ESIGN_SECRET_KEY, ESIGN_WEBHOOK_SECRET: env.ESIGN_WEBHOOK_SECRET}' \
            | npx wrangler secret bulk --config dist/server/wrangler.json --name cas-sign
